#
# docker-compose.yml for weewx-rtldavis: the WeeWX + RTL-SDR receiver only.
#
# Downstream consumers (InfluxDB, a dashboard) are not defined here; point the
# uploaders in weewx.conf at whatever you run. See README.md for the steps
# this assumes: the udev rule that lets your user open the dongle, and the
# starter config copied out of the image into weewx-data/.
#
# Usage: edit the values marked below, then `docker compose up -d`.
#
# The driver is baked into the image. Don't bind-mount rtldavis.py over it:
# the copy `weectl extension install` leaves in weewx-data/bin/user/ is the
# stock upstream driver, and mounting it silently undoes every fix.
#
services:
  weewx-rtldavis:
    container_name: weewx-rtldavis
    image: weatheredscientist/weewx-rtldavis:v2.3.0
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"   # your uid:gid (`id -u`, `id -g`); set in .env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    devices:
      - /dev/bus/usb:/dev/bus/usb
    env_file:
      - path: .env               # TZ, BIAS_TEE and the first-start values; see .env.example
        required: false
    environment:
      - HOME=/tmp
      - TZ=${TZ:-UTC}            # your time zone, so daily rain resets at local midnight
      - BIAS_TEE=${BIAS_TEE:-0}  # 1 only if an LNA is powered through the dongle
    volumes:
      - ./weewx-data:/opt/weewx-data
      - ./logs:/var/log/weewx
